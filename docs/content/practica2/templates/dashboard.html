<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Estacionamiento - Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h1 class="mb-4">Simulador de Estacionamiento</h1>
    
    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card bg-primary text-white p-3">
                <h3>Ocupación</h3>
                <p class="display-6">{{ occupied }} / {{ total }}</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card bg-success text-white p-3">
                <h3>Ganancia Total</h3>
                <p class="display-6">${{ revenue }}</p>
            </div>
        </div>
    </div>

    <div class="mb-4">
        <a href="/entry" class="btn btn-success">Registrar Entrada</a>
    </div>

    <h3>Tickets Activos</h3>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID Ticket</th>
                <th>Placa</th>
                <th>Tipo</th>
                <th>Lugar</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody>
            {% for t in tickets %}
            <tr>
                <td>{{ t.id }}</td>
                <td>{{ t.v.plate }}</td>
                <td>{{ t.v.v_type.value }}</td>
                <td>{{ t.s.spot_id }}</td>
                <td>
                    <form action="/exit" method="POST">
                        <input type="hidden" name="ticket_id" value="{{ t.id }}">
                        <button type="submit" class="btn btn-danger btn-sm">Cobrar y Salir</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
