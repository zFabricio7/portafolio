<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Entrada de Vehículo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h2>Registrar Entrada</h2>
    <form method="POST" class="mt-4 shadow p-4 rounded bg-light">
        <div class="mb-3">
            <label class="form-label">Número de Placa:</label>
            <input type="text" name="plate" class="form-control" required placeholder="ABC-123">
        </div>
        <div class="mb-3">
            <label class="form-label">Tipo de Vehículo:</label>
            <select name="type" class="form-select">
                <option value="CAR">Carro ($20/hr)</option>
                <option value="MOTORCYCLE">Moto ($10/hr)</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Generar Ticket</button>
        <a href="/" class="btn btn-secondary">Cancelar</a>
    </form>
</body>
</html>
